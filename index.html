<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyDoc | Distraction-Free Writing</title>
  <meta name="description" content="A premium writing software for short stories, poems, and creative documents.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="src/style.css">
</head>
<body class="dark-theme">
  <div id="app">
    <div class="bg-glow"></div>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h1>MyDoc</h1>
        <div class="header-actions">
          <button id="new-doc-btn" class="btn-primary" title="New Document">+</button>
        </div>
      </div>

      <div class="sync-panel">
        <div class="sync-section">
          <label>SYNC VIA CODE</label>
          <div class="sync-input-group">
            <input type="text" id="sync-code" placeholder="Enter 6-digit code..." maxlength="6">
            <button id="sync-download-btn" class="btn-icon mini" title="Sync from Cloud">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <button id="sync-upload-btn" class="btn-icon mini" title="Upload to Cloud">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </button>
          </div>
        </div>
        
        <div class="sync-section">
          <label>SYNC VIA LINK</label>
          <div class="sync-input-group">
            <input type="text" id="sync-link-field" placeholder="Generated link will appear here..." readonly>
            <button id="sync-copy-link-btn" class="btn-icon mini" title="Copy Shareable Link">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </button>
          </div>
        </div>
      </div>
      <div id="doc-list" class="doc-list">
        <!-- Documents will be injected here -->
      </div>
      <div class="sidebar-footer">
        <span id="doc-count">0 documents</span>
      </div>
    </aside>

    <main id="editor-container" class="editor-container">
      <header id="editor-header" class="editor-header">
        <div class="header-left">
          <button id="toggle-sidebar" class="btn-icon" title="Toggle Sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <input type="text" id="doc-title" placeholder="Untitled Story..." class="doc-title-input">
        </div>
        <div class="editor-actions">
          <span id="save-status">Saved</span>
          
          <div class="toolbar-divider"></div>
          
          <button id="focus-mode-btn" class="btn-icon" title="Focus Mode">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
          </button>
          
          <button id="typewriter-mode-btn" class="btn-icon" title="Typewriter Mode">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
          </button>

          <div class="toolbar-divider"></div>

          <button id="delete-doc-btn" class="btn-icon secondary" title="Delete Document">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
          </button>
          <button id="export-btn" class="btn-icon" title="Export to TXT">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          </button>
        </div>
      </header>
      
      <div class="editor-content-wrapper">
        <textarea id="editor" placeholder="Start writing something beautiful..." spellcheck="false"></textarea>
      </div>

      <footer class="editor-footer">
        <div class="stats">
          <span id="reading-time">1 min read</span>
          <span class="dot">·</span>
          <span id="word-count">0 words</span>
          <span class="dot">·</span>
          <span id="char-count">0 characters</span>
        </div>
      </footer>
    </main>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
